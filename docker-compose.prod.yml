version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: flowforge-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_in_production_db_password_12345}
      POSTGRES_DB: ${POSTGRES_DB:-flowforge_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowforge} -d ${POSTGRES_DB:-flowforge_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  redis:
    image: redis:7-alpine
    container_name: flowforge-prod-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: flowforge-prod-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: "0.0.0.0"
      API_PREFIX: "/api/v1"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-flowforge}:${POSTGRES_PASSWORD:-change_this_in_production_db_password_12345}@postgres:5432/${POSTGRES_DB:-flowforge_db}?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: ${JWT_SECRET:-flowforge_prod_jwt_super_secret_key_at_least_32_characters_long_1234}
      COOKIE_SECRET: ${COOKIE_SECRET:-flowforge_prod_cookie_secret_at_least_32_characters_long_1234}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      MAX_WORKFLOW_STEPS: 500
      MAX_EXECUTION_DURATION_SECONDS: 300
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.worker
    container_name: flowforge-prod-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      WORKER_HEALTH_PORT: 4001
      DATABASE_URL: "postgresql://${POSTGRES_USER:-flowforge}:${POSTGRES_PASSWORD:-change_this_in_production_db_password_12345}@postgres:5432/${POSTGRES_DB:-flowforge_db}?schema=public"
      REDIS_URL: "redis://redis:6379"
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      MAX_WORKFLOW_STEPS: 500
      MAX_EXECUTION_DURATION_SECONDS: 300
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4001/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: flowforge-prod-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      API_INTERNAL_URL: "http://api:4000"
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M

volumes:
  postgres_prod_data:
  redis_prod_data:
